<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeno MM2 Trade - Calculator</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #070707;
  color: white;
  min-height: 100vh;
}

nav {
  height: 75px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 7%;
  border-bottom: 1px solid #292929;
  background: #090909;
}

.logo {
  color: #ffd21a;
  font-size: 25px;
  font-weight: 900;
}

nav a {
  color: #aaa;
  text-decoration: none;
  margin: 0 15px;
}

nav a:hover {
  color: #ffd21a;
}

.container {
  max-width: 1000px;
  margin: 70px auto;
  padding: 20px;
}

.title {
  text-align: center;
  margin-bottom: 45px;
}

.title h1 {
  font-size: 48px;
}

.title span {
  color: #ffd21a;
}

.title p {
  color: #888;
  margin-top: 12px;
}

.calculator {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.side {
  background: #101010;
  border: 1px solid #292929;
  border-radius: 18px;
  padding: 25px;
}

.side h2 {
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 15px;
  background: #080808;
  color: white;
  border: 1px solid #333;
  border-radius: 10px;
  outline: none;
  margin-bottom: 15px;
}

input:focus {
  border-color: #ffd21a;
}

.item {
  display: flex;
  justify-content: space-between;
  background: #171717;
  padding: 15px;
  border-radius: 10px;
  margin-top: 10px;
}

.value {
  color: #ffd21a;
  font-weight: bold;
}

.result {
  margin-top: 25px;
  text-align: center;
  background: #101010;
  border: 1px solid #292929;
  border-radius: 18px;
  padding: 30px;
}

.result h2 {
  color: #ffd21a;
  margin-bottom: 10px;
}

.total {
  font-size: 35px;
  font-weight: bold;
}

button {
  margin-top: 20px;
  padding: 14px 28px;
  border: none;
  border-radius: 10px;
  background: #ffd21a;
  color: #000;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: .85;
}

@media(max-width:700px) {
  .calculator {
    grid-template-columns: 1fr;
  }

  nav .links {
    display: none;
  }

  .title h1 {
    font-size: 38px;
  }
}
</style>
</head>

<body>

<nav>
  <div class="logo">ZENO MM2</div>

  <div class="links">
    <a href="index.html">Home</a>
    <a href="calculator.html">Calculator</a>
    <a href="#">Trade</a>
    <a href="#">Values</a>
  </div>
</nav>

<div class="container">

  <div class="title">
    <h1>Trade <span>Calculator</span></h1>
    <p>Check your trade before you accept it.</p>
  </div>

  <div class="calculator">

    <div class="side">
      <h2>👤 Your Offer</h2>

      <input id="yourValue" type="number" placeholder="Enter your total value">

      <div class="item">
        <span>Your Items</span>
        <span class="value" id="yourDisplay">0</span>
      </div>
    </div>

    <div class="side">
      <h2>🤝 Their Offer</h2>

      <input id="theirValue" type="number" placeholder="Enter their total value">

      <div class="item">
        <span>Their Items</span>
        <span class="value" id="theirDisplay">0</span>
      </div>
    </div>

  </div>

  <div class="result">
    <h2 id="resultTitle">TRADE RESULT</h2>

    <div class="total" id="difference">Enter values</div>

    <button onclick="calculateTrade()">Check Trade</button>
  </div>

</div>

<script>
function calculateTrade() {

  const yours = Number(document.getElementById("yourValue").value);
  const theirs = Number(document.getElementById("theirValue").value);

  document.getElementById("yourDisplay").textContent = yours;
  document.getElementById("theirDisplay").textContent = theirs;

  if (!yours || !theirs) {
    document.getElementById("difference").textContent =
      "Enter both values";
    return;
  }

  const difference = theirs - yours;

  if (difference > 0) {
    document.getElementById("resultTitle").textContent = "WIN 🏆";
    document.getElementById("difference").textContent =
      "+" + difference + " Value";
  } 
  else if (difference === 0) {
    document.getElementById("resultTitle").textContent = "FAIR 🤝";
    document.getElementById("difference").textContent =
      "Equal Value";
  } 
  else {
    document.getElementById("resultTitle").textContent = "LOSE ⚠️";
    document.getElementById("difference").textContent =
      difference + " Value";
  }
}
</script>

</body>
</html>
